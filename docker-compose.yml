name: seo-builder

services:
  builder:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: seo-builder:latest
    container_name: seo-builder
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN:?set API_TOKEN in .env}
      VENICE_API_KEY: ${VENICE_API_KEY:-}
      PANEL_API_KEY: ${PANEL_API_KEY:-}
      PANEL_API_URL: ${PANEL_API_URL:-https://florentina-tr.shop}
      BUILD_TIMEOUT: ${BUILD_TIMEOUT:-3600}
      DEPLOY_TIMEOUT: ${DEPLOY_TIMEOUT:-600}
    volumes:
      - plans:/app/plans
      - sites:/app/sites
      - profiles:/app/profiles
      - content:/app/content
    networks: [buildnet]

  # TLS sidecar: serves https://<host>:8443 -> builder:8080 with an
  # auto-issued internal (self-signed) certificate. Clients on the same
  # machine use -k / skip-verify, or mount their own CA.
  caddy:
    image: caddy:2-alpine
    container_name: seo-builder-tls
    restart: unless-stopped
    depends_on: [builder]
    ports:
      - "8443:8443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [buildnet]

networks:
  buildnet: {}

volumes:
  plans: {}
  sites: {}
  profiles: {}
  content: {}
  caddy_data: {}
  caddy_config: {}
