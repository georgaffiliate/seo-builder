<section class="section sec sec-scarcity">
  <div class="wrap blk-scarcity">
    <div>
      <div class="eyebrow">{{c:scarcity.eyebrow}}</div>
      <h2>{{c:scarcity.h2}}</h2>
      <p>{{c:scarcity.lead}}</p>
      <a class="blk-btn" href="#claim">{{c:scarcity.btn}} <span>↗</span></a>
    </div>
    <div class="countdown" id="countdown" aria-label="{{c:ui.aria_timer}}">
      <div><b data-unit="days">02</b><small>{{c:scarcity.units.0}}</small></div>
      <div><b data-unit="hours">13</b><small>{{c:scarcity.units.1}}</small></div>
      <div><b data-unit="minutes">04</b><small>{{c:scarcity.units.2}}</small></div>
      <div><b data-unit="seconds">43</b><small>{{c:scarcity.units.3}}</small></div>
    </div>
  </div>
</section>
