<section class="section alt sec sec-office" data-var="c">
  <div class="wrap center-band">
    <div class="eyebrow center">{{c:office.eyebrow}}</div>
    <h2>{{c:office.h2}}</h2>
    <p>{{c:office.lead}}</p>
    <div class="chip-row center">
      <span class="mkt-chip"><small>{{c:office.addr_label}}</small> {{c:office.addr}}</span>
      <span class="mkt-chip"><small>{{c:office.hours_label}}</small> {{c:office.hours}}</span>
      <span class="mkt-chip"><small>{{c:office.contact_label}}</small> <a href="mailto:info@{{DOMAIN}}">info@{{DOMAIN}}</a></span>
    </div>
  </div>
</section>
