<section class="section alt sec sec-demo sec-demo-book" data-var="f" id="demo">
  <div class="wrap dw-split">
    <div class="dw-copy">
      <div class="eyebrow">{{c:sections.demo.eyebrow}}</div>
      <h2>{{c:sections.demo.h2}}</h2>
      <p>{{c:sections.demo.lead}}</p>
      <p class="fine">{{c:sections.demo.disclaimer}}</p>
    </div>
    <div class="dw-card wk-root dw-book-card">
      <div class="dw-book-head">
        <b>{{c:sections.markets.rows.0.sym}}</b>
        <span class="dw-live"><i aria-hidden="true"></i>{{W_DEMO}}</span>
      </div>
      <div class="wk-book" data-widget="book-ladder" data-base="{{W_BOOK_BASE}}" data-dec="{{W_BOOK_DEC}}" role="img" aria-label="{{c:sections.demo.h2}}">
        <div class="wk-book-row bid" data-lvl="-3"><span>{{W_BID}}</span><b>—</b><i></i></div>
        <div class="wk-book-row bid" data-lvl="-2"><span>{{W_BID}}</span><b>—</b><i></i></div>
        <div class="wk-book-row bid" data-lvl="-1"><span>{{W_BID}}</span><b>—</b><i></i></div>
        <div class="wk-book-row ask" data-lvl="1"><span>{{W_ASK}}</span><b>—</b><i></i></div>
        <div class="wk-book-row ask" data-lvl="2"><span>{{W_ASK}}</span><b>—</b><i></i></div>
        <div class="wk-book-row ask" data-lvl="3"><span>{{W_ASK}}</span><b>—</b><i></i></div>
      </div>
    </div>
  </div>
</section>
