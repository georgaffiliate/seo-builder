<section class="section sec sec-demo sec-demo-gauge" data-var="e" id="demo">
  <div class="wrap dw-split">
    <div class="dw-copy">
      <div class="eyebrow">{{c:sections.demo.eyebrow}}</div>
      <h2>{{c:sections.demo.h2}}</h2>
      <p>{{c:sections.demo.lead}}</p>
      <p class="fine">{{c:sections.demo.disclaimer}}</p>
    </div>
    <div class="dw-card wk-root dw-gauge-card">
      <span class="dw-card-tag">{{c:sections.demo.eyebrow}}</span>
      <div class="wk-gauge" data-widget="sentiment-gauge" role="img" aria-label="{{c:sections.demo.h2}}">
        <svg viewBox="0 0 220 120" aria-hidden="true">
          <path class="wk-arc" d="M20 100 A90 90 0 0 1 200 100"/>
          <path class="wk-arc-fill" d="M20 100 A90 90 0 0 1 200 100" stroke-dasharray="172 999"/>
          <line class="wk-needle" x1="110" y1="100" x2="110" y2="30"/>
          <circle cx="110" cy="100" r="5" fill="var(--wk-ink)"/>
        </svg>
        <b><span data-score data-score="{{W_SCORE}}">{{W_SCORE}}</span></b>
      </div>
      <div class="dw-scale" aria-hidden="true"><span>0</span><span>50</span><span>100</span></div>
    </div>
  </div>
</section>
