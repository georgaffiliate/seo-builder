<section class="section sec sec-office" data-var="b">
  <div class="wrap split-media">
    <div>
      <div class="eyebrow">{{c:office.eyebrow}}</div>
      <h2>{{c:office.h2}}</h2>
      <p>{{c:office.lead}}</p>
    </div>
    <div class="office-card">
      <div><small>{{c:office.addr_label}}</small><b>{{c:office.addr}}</b></div>
      <div><small>{{c:office.hours_label}}</small><b>{{c:office.hours}}</b></div>
      <div><small>{{c:office.phone_label}}</small><b><a href="tel:{{PHONE_TEL}}">{{PHONE}}</a></b></div>
      <div><small>{{c:office.contact_label}}</small><b><a class="js-mail" href="index.php#claim" data-u="info" data-d="{{DOMAIN}}">{{c:office.email_label}}</a></b></div>
    </div>
  </div>
</section>
