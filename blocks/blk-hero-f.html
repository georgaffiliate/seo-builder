<section class="blk-hero hero-steps-sec sec sec-hero" id="top" data-var="f">
  <div class="hero-top">
    <h1><span class="brand-line">{{BRAND}}</span> {{c:hero.h1_rest}}<br><span class="h1-accent">{{c:hero.h1_accent}}</span></h1>
    <a class="blk-btn" href="#claim">{{c:hero.cta_primary}} <span>↗</span></a>
  </div>
  <p class="blk-hero-lead">{{c:hero.lead}}</p>
  <p class="hero-band-note">{{c:hero.note}}</p>
  <ol class="hero-steps">
    <li><span class="n">01</span><b>{{c:hero.proof.steps.0.t}}</b><span>{{c:hero.proof.steps.0.d}}</span></li>
    <li><span class="n">02</span><b>{{c:hero.proof.steps.1.t}}</b><span>{{c:hero.proof.steps.1.d}}</span></li>
    <li><span class="n">03</span><b>{{c:hero.proof.steps.2.t}}</b><span>{{c:hero.proof.steps.2.d}}</span></li>
  </ol>
</section>
