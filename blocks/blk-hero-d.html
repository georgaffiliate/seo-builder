<section class="blk-hero hero-statement sec sec-hero" id="top" data-var="d">
  <h1><span class="brand-line">{{BRAND}}</span> {{c:hero.h1_rest}}<br><span class="h1-accent">{{c:hero.h1_accent}}</span></h1>
  <p class="blk-hero-lead">{{c:hero.lead}}</p>
  <p class="hero-band-note">{{c:hero.note}}</p>
  <div class="hero-cta center">
    <a class="blk-btn" href="#claim">{{c:hero.cta_primary}} <span>↗</span></a>
    <a class="text-link" href="#come">{{c:hero.cta_secondary}} →</a>
  </div>
  <ul class="hero-claims">
    <li>{{c:hero.proof.claims.0}}</li>
    <li>{{c:hero.proof.claims.1}}</li>
    <li>{{c:hero.proof.claims.2}}</li>
  </ul>
  <div class="trust-line center"><span class="stars">★★★★★</span> <b>{{RATING}}/5</b> · {{REVIEWS}} {{c:hero.trust_label}}</div>
</section>
