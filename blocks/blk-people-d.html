<section class="section sec sec-people" id="reviews" data-var="d">
  <div class="wrap">
    <div class="eyebrow">{{c:reviews.eyebrow}}</div>
    <h2>{{c:reviews.h2}}</h2>
    <figure class="pull-quote">
      <blockquote>“{{c:reviews.items.0.quote}}”</blockquote>
      <figcaption>{{c:reviews.items.0.name}} — {{c:reviews.items.0.role}}, {{c:reviews.items.0.city}}</figcaption>
    </figure>
    <div class="pull-mini">
      <figure><blockquote>“{{c:reviews.items.1.quote}}”</blockquote><figcaption>{{c:reviews.items.1.name}} · {{c:reviews.items.1.tenure}}</figcaption></figure>
      <figure><blockquote>“{{c:reviews.items.2.quote}}”</blockquote><figcaption>{{c:reviews.items.2.name}} · {{c:reviews.items.2.tenure}}</figcaption></figure>
    </div>
  </div>
</section>
