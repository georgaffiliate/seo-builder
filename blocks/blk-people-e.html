<section class="section alt sec sec-people" id="reviews" data-var="e">
  <div class="wrap rating-split">
    <div class="rating-side">
      <b class="rating-big">{{RATING}}<small>/5</small></b>
      <span class="stars" aria-hidden="true">★★★★★</span>
      <small>{{REVIEWS}} · {{c:sections.stats.reviews}}</small>
      <p>{{c:reviews.lead}}</p>
    </div>
    <div class="quotes-side">
      <figure><blockquote>“{{c:reviews.items.0.quote}}”</blockquote><figcaption>{{c:reviews.items.0.name}} · {{c:reviews.items.0.city}} · {{c:reviews.items.0.tenure}}</figcaption></figure>
      <figure><blockquote>“{{c:reviews.items.1.quote}}”</blockquote><figcaption>{{c:reviews.items.1.name}} · {{c:reviews.items.1.city}} · {{c:reviews.items.1.tenure}}</figcaption></figure>
    </div>
  </div>
</section>
