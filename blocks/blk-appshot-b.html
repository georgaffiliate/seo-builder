<section class="section alt sec sec-appshot" data-var="b">
  <div class="wrap appshot-grid">
    <figure class="appshot-media">
      <img src="img/appshot.jpg" alt="{{c:sections.appshot.alt}}" loading="lazy" decoding="async">
    </figure>
    <div class="appshot-copy">
      <div class="eyebrow">{{c:sections.appshot.eyebrow}}</div>
      <h2>{{c:sections.appshot.h2}}</h2>
      <p class="appshot-lead">{{c:sections.appshot.lead}}</p>
      <ul class="appshot-points">
        <li>{{c:sections.appshot.points.0}}</li>
        <li>{{c:sections.appshot.points.1}}</li>
        <li>{{c:sections.appshot.points.2}}</li>
      </ul>
    </div>
  </div>
</section>
