name: deploy

# Auto-deploy: on push to main, sync the code to the server over SSH
# (rsync, .env excluded) and rebuild the stack. No server -> GitHub access needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup ssh
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: sync code to server
        run: |
          rsync -az --delete \
            --exclude '.env' --exclude '.git' \
            -e "ssh -p ${SSH_PORT:-22} -o StrictHostKeyChecking=accept-new" \
            ./ "${SSH_USER}@${SSH_HOST}:/opt/seo-builder/app/"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}

      - name: rebuild + health check
        run: |
          ssh -p "${SSH_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            'APP_DIR=/opt/seo-builder/app bash /opt/seo-builder/app/scripts/deploy.sh'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
