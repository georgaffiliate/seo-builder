<!-- WIDGET flip-clock ✀ · flipping timer cards (same countdown hook). -->
<div class="wk-flip" data-widget="countdown" data-key="intake" id="countdown" aria-label="{Czas do końca}">
  <div><b data-unit="days" class="is-flap">02</b><small>{dni}</small></div>
  <div><b data-unit="hours">13</b><small>{godz}</small></div>
  <div><b data-unit="minutes">04</b><small>{min}</small></div>
  <div><b data-unit="seconds">43</b><small>{sek}</small></div>
</div>
