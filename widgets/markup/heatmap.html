<!-- WIDGET heatmap ✀ · asset heat map. data-chg = % change (sign = color). -->
<div class="wk-heatmap" data-widget="heatmap" role="img" aria-label="{Mapa cieplna rynków}">
  <span data-sym="BTC" data-chg="2.1">BTC<small>+2,1 %</small></span>
  <span data-sym="ETH" data-chg="1.4">ETH<small>+1,4 %</small></span>
  <span data-sym="DAX" data-chg="-0.6">DAX<small>−0,6 %</small></span>
  <span data-sym="Gold" data-chg="0.4">Gold<small>+0,4 %</small></span>
  <span data-sym="EUR/USD" data-chg="-0.2">EUR/USD<small>−0,2 %</small></span>
  <span data-sym="Brent" data-chg="0.9">Brent<small>+0,9 %</small></span>
</div>
