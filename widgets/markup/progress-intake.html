<!-- WIDGET progress-intake ✀ · seat-fill progress bar (no countdown promise). -->
<div class="wk-progress" data-widget="progress-intake">
  <div class="wk-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="27">
    <i style="--fill:27%"></i>
  </div>
  <p><b data-seats>11</b> {wolnych miejsc} · <span data-percent>27</span> % {zajęte}</p>
</div>
