<!-- WIDGET countdown-bar · horizontal timer bar. -->
<div class="wk-cdbar" data-widget="countdown" data-key="intake" id="countdown" aria-label="{Czas do końca}">
  <div><b data-unit="days">02</b><small>{dni}</small></div>
  <div><b data-unit="hours">13</b><small>{godz}</small></div>
  <div><b data-unit="minutes">04</b><small>{min}</small></div>
  <div><b data-unit="seconds">43</b><small>{sek}</small></div>
</div>
