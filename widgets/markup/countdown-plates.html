<!-- WIDGET countdown-plates · timer as plates. Shared hook: [data-widget=countdown] + [data-unit]. -->
<div class="wk-countdown" data-widget="countdown" data-key="intake" id="countdown" aria-label="{Czas do zamknięcia zapisów}">
  <div><b data-unit="days">02</b><small>{dni}</small></div>
  <div><b data-unit="hours">13</b><small>{godz}</small></div>
  <div><b data-unit="minutes">04</b><small>{min}</small></div>
  <div><b data-unit="seconds">43</b><small>{sek}</small></div>
</div>
