<!-- WIDGET faq-split ✀ · questions left / answer right. For SEO keep the full text in HTML. -->
<section class="wk-faq-split" data-widget="faq-split">
  <div class="wk-questions" role="tablist">
    <button type="button" class="wk-q" data-q="q1" role="tab" aria-selected="true">{Pytanie 1}</button>
    <button type="button" class="wk-q" data-q="q2" role="tab" aria-selected="false">{Pytanie 2}</button>
    <button type="button" class="wk-q" data-q="q3" role="tab" aria-selected="false">{Pytanie 3}</button>
  </div>
  <div class="wk-answer" data-a="q1" role="tabpanel">{Odpowiedź 1}</div>
  <div class="wk-answer" data-a="q2" role="tabpanel" hidden>{Odpowiedź 2}</div>
  <div class="wk-answer" data-a="q3" role="tabpanel" hidden>{Odpowiedź 3}</div>
</section>
